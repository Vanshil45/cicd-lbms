name: Starter Pipeline
repoFullName: Vanshil45-Vanshil45/cicd-lbms
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
    
        
        run: npm install

      - name: Lint
        # No lint script exists yet; this runs automatically once one is added to package.json.
        run: npm run lint --if-present

      - name: Test
        # No test script exists yet; this runs automatically once one is added to package.json.
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html not found" && exit 1)
          ls -la dist dist/assets

      - name: Smoke test (vite preview)
        run: |
          npx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4173 | grep -q '<div id="root">' || (echo "Smoke test failed" && kill $PREVIEW_PID && exit 1)
          echo "Smoke test passed"
          kill $PREVIEW_PID

      - name: Security scan
        run: npm audit --audit-level=high

      - name: Deployment to Staging
        # The app builds to static files in dist/. Replace with your staging host's deploy command.
        run: echo "Deploy dist/ to staging (e.g. S3, Netlify, Vercel, Nginx) goes here..."

      - name: Deployment to Production
        # Replace with your production host's deploy command.
        run: echo "Deploy dist/ to production goes here..."
